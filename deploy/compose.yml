# auth-api: the service this repository contributes to the platform.
# market-agri-infra includes this file (Annex G). No `ports`: only the API Gateway is
# published; auth-api is reachable only on the `platform` network.
# Every value comes from the market-agri-infra .env; missing ones fail with a clear message.

services:
  auth-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://auth-db:5432/auth
      DATABASE_USER: ${AUTH_DB_USER:?AUTH_DB_USER is not set}
      DATABASE_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is not set}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is not set}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is not set}
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is not set}
    expose:
      - "8080"
    # No depends_on auth-db: that service lives in market-agri-auth-db and would make this file
    # invalid on its own. The pool connects lazily; GET /health/ready reports the database.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    # Longer than the 20 s graceful shutdown declared in application.yml.
    stop_grace_period: 25s
    restart: unless-stopped
    networks:
      - platform

networks:
  platform:
    external: true

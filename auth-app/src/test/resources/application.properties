# Unit and HTTP tests run without a database: the pool points to an address nobody listens on,
# so readiness reports the database DOWN. The integration tests replace the URL.
spring.datasource.url=jdbc:postgresql://localhost:1/unreachable
spring.datasource.username=auth_app
spring.datasource.password=unused
# The issuer and the kid of the tokens (ADR-020) for the Spring tests; the private key comes from
# AuthSpringTest, generated per run. Without them the composition root does not start.
auth.jwt.issuer=market-agri-auth
auth.jwt.key-id=kid-test
